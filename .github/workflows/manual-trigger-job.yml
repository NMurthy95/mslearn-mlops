name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3   # stable version

      - name: Install az ml extension
        run: az extension add -n ml -y

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure login
        run: az account show

      - name: Debug variables
        run: |
          echo "Resource Group: ${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "Workspace Name: ${{ vars.AZURE_WORKSPACE_NAME }}"

      - name: Run Azure Machine Learning training job
        run: |
          az ml job create -f src/job.yml \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }}
